name: Deploy Database to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy_to_supabase.yml'
      - '.github/deploy_supabase.py'
  workflow_dispatch:

jobs:
  deploy-database:
    name: Deploy Migrations to Supabase Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Database Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Deploy Migrations & Seeds to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python .github/deploy_supabase.py
