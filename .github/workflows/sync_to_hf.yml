name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ ERROR: HF_TOKEN is missing."
            echo "Please add your Hugging Face Write Token in: Settings -> Secrets and variables -> Actions -> Repository Secrets."
            exit 1
          fi
          echo "Syncing repository to Hugging Face Space..."
          git push --force https://subham240:$HF_TOKEN@huggingface.co/spaces/subham240/botpulse-api main:main
          echo "✓ Successfully synced to Hugging Face Hub!"
