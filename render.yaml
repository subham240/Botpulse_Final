services:
  - type: web
    name: botpulse-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOTPULSE_SECRET_KEY
        value: b9f71c4820d8e847b2c58971fce81a8b302c46a819b12e3e528b17b6d194c7a2
      - key: MONGODB_URI
        value: mongodb://localhost:27017
